name: Validate

on:
  pull_request:
    branches:
      - '*'

env:
  GO_VERSION: '1.26.6'
  GOLANGCI_LINT_VERSION: v2.12.2
  MISSPELL_VERSION: v0.6.0

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: '${{ env.GOLANGCI_LINT_VERSION }}'

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install misspell ${{ env.MISSPELL_VERSION }}
        run: curl -sfL https://raw.githubusercontent.com/golangci/misspell/HEAD/install-misspell.sh | sh -s -- -b $(go env GOPATH)/bin ${MISSPELL_VERSION}

      - name: Validate
        run: make validate-files

  validate-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

  vulncheck:
    name: Vulnerability Scan (delta)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Both the base and the head commit have to be present locally: the
          # scan below builds each in its own worktree, and a shallow clone has
          # neither.
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Reports what this pull request ADDS to the set of vulnerabilities
      # reachable from our own code, and deliberately does not fail on it yet.
      #
      # Set GOVULNCHECK_BLOCK=1 to make additions fail the job. It is off until
      # this has run for two weeks without a false positive (cyprob/cyprob#247),
      # and the commit that sets it must also pin GOVULNCHECK_VERSION — a
      # floating tool version is harmless while this reports and is a way to
      # stop CI from outside git once it blocks. See scripts/govulncheck-delta.sh.
      # A gate nobody has watched is worse than no gate, because it is trusted
      # without being looked at — and this repository runs with `strict: false`,
      # so a required check is less required than it looks anyway.
      - name: govulncheck (delta against base)
        run: |
          ./scripts/govulncheck-delta.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  fingerprint-db-validation:
    name: Validate Fingerprint Database
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build cyprob CLI
        run: go build -o dist/cyprob ./cmd

      - name: Validate fingerprint_db.yaml
        run: ./dist/cyprob fingerprint validate pkg/fingerprint/data/fingerprint_db.yaml

  error-handling:
    name: Error Handling Standards (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Plugin commands (REQUIRED - enforced)
          - target: plugin
            path: cmd/cyprob/commands/plugin
            pattern: 'return\s+formatter\.PrintError\s*\('
            suggestion: 'Use formatter.PrintTotalFailureSummary(operation, err, plugin.ErrorCode(err))'
            required: true

          # Future targets (NOT YET ENFORCED - will be enabled as standards are defined)
          # - target: scan
          #   path: cmd/cyprob/commands/scan
          #   pattern: 'return\s+formatter\.PrintError\s*\('
          #   suggestion: 'Use standardized error wrapper (TBD)'
          #   required: false
          #
          # - target: storage
          #   path: cmd/cyprob/commands/storage
          #   pattern: 'return\s+formatter\.PrintError\s*\('
          #   suggestion: 'Use standardized error wrapper (TBD)'
          #   required: false
          #
          # - target: server
          #   path: cmd/cyprob/commands/server
          #   pattern: 'return\s+formatter\.PrintError\s*\('
          #   suggestion: 'Use standardized error wrapper (TBD)'
          #   required: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep_14.1.0-1_amd64.deb
          sudo dpkg -i ripgrep_14.1.0-1_amd64.deb

      - name: Check error handling patterns
        run: |
          chmod +x .github/scripts/check-error-handling.sh
          .github/scripts/check-error-handling.sh \
            "${{ matrix.path }}" \
            "${{ matrix.pattern }}" \
            "${{ matrix.suggestion }}"

      - name: Report non-required violations
        if: failure() && matrix.required == false
        run: |
          echo "::warning::Error handling violations found in ${{ matrix.target }}, but not yet enforced"
          exit 0
